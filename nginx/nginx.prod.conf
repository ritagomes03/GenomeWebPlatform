server {
    listen 80;
    server_name _;

    # Allow large FASTA uploads
    client_max_body_size 100M;

    root /usr/share/nginx/html;
    index index.html;

    # Django API and admin
    location ~ ^/(api|admin)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sequence analysis and large downloads can take a while
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Django static files (admin CSS, etc.)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Built React assets (hashed filenames, safe to cache long-term)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React SPA: fall back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
